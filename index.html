<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DriverSide — the only one at the table on your side</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@600&display=swap"
      rel="stylesheet"
    />
    <style>
      body { margin: 0; }
      :focus { outline: none; }
      :focus-visible { outline: 2px solid #5980a6; outline-offset: 2px; }
      ::selection { background: rgba(89, 128, 166, 0.3); }
      /* Start screen: the dealer door's live dot. Motion is a signal that
         something is happening now, so it is the one animation here — and
         it stops entirely for anyone who asked for less. */
      @keyframes ds-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.45; transform: scale(0.82); }
      }
      .ds-pulse { animation: ds-pulse 2.4s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .ds-pulse { animation: none; }
        * { transition: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
