<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DriverSide — the only one at the table on your side</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#16233B" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body { margin: 0; }
      :focus { outline: none; }
      :focus-visible { outline: 2px solid #2B5A87; outline-offset: 2px; }
      /* On dark surfaces the ring goes light blue (8.2:1), with a thin dark
         gap so it still reads around a light button. */
      .ds-dark :focus-visible, .ds-onnavy:focus-visible, .ds-onnavy :focus-visible { outline: 3px solid #8DB4DC; outline-offset: 2px; box-shadow: 0 0 0 1px #0F1826; }
      /* Headings get focus when a screen changes; no ring for that. */
      h1[tabindex="-1"]:focus, #ds-main:focus { outline: none; }
      /* Text fields and selects: a visible edge (WCAG 1.4.11), red when wrong. */
      input:not([type="range"]):not([type="checkbox"]):not([type="radio"]), select, textarea { border-color: var(--c-control, #8A8371) !important; }
      [aria-invalid="true"] { border-color: var(--c-red, #B23A2E) !important; border-width: 2px !important; }
      /* Screen-reader-only text, and the skip link that appears on focus. */
      .ds-sr { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
      .ds-skip { position: absolute; left: 12px; top: -64px; z-index: 50; background: #16233B; color: #FFFFFF; padding: 12px 16px; font-weight: 700; text-decoration: none; }
      .ds-skip:focus { top: 12px; }
      /* Ask: the browser's own modal dialog, docked to the bottom. */
      dialog.ds-ask { position: fixed; inset: auto 0 0 0; margin: 0 auto; padding: 0; border: 0; width: 100%; max-width: 520px; height: 86vh; max-height: 760px; overflow: hidden; }
      dialog.ds-ask[open] { display: flex; flex-direction: column; }
      dialog.ds-ask.ds-wide { max-width: 640px; }
      dialog.ds-ask::backdrop { background: rgba(15, 24, 38, 0.5); }
      ::selection { background: #FFE08A; }
      body { background: #FAF7F0; }
      /* Start screen: the dealer door's live dot. Motion is a signal that
         something is happening now, so it is the one animation here — and
         it stops entirely for anyone who asked for less. */
      @keyframes ds-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.45; transform: scale(0.82); }
      }
      .ds-pulse { animation: ds-pulse 2.4s ease-in-out infinite; }
      /* Sliders: a 44px-tall touch strip, a 6px track filled in accent up
         to the thumb (--fill is set inline), and a 28px thumb that's easy
         to find with a thumb. */
      input.ds-range { -webkit-appearance: none; appearance: none; width: 100%; height: 44px; margin: 0; background: transparent; cursor: pointer; touch-action: pan-y; }
      input.ds-range::-webkit-slider-runnable-track { height: 6px; background: linear-gradient(to right, #2B5A87 var(--fill, 0%), #8A8371 var(--fill, 0%)); }
      input.ds-range::-moz-range-track { height: 6px; background: #8A8371; }
      input.ds-range::-moz-range-progress { height: 6px; background: #2B5A87; }
      input.ds-range::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; margin-top: -11px; border-radius: 50%; background: #FFFFFF; border: 2px solid #16233B; box-shadow: 0 1px 3px rgba(22,35,59,0.25); }
      input.ds-range::-moz-range-thumb { width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF; border: 2px solid #16233B; }
      /* Untouched: dashed and mid-grey (5.5:1), so "not set" isn't a pale ghost. */
      input.ds-range.ds-unset::-webkit-slider-thumb { border: 2.5px dashed #5A6478; }
      input.ds-range.ds-unset::-moz-range-thumb { border: 2.5px dashed #5A6478; }
      input.ds-range:focus-visible { outline: 2px solid #2B5A87; outline-offset: 2px; }
      input.ds-range.ds-dark:focus-visible { outline: 3px solid #8DB4DC; }
      /* Dealer mode (dark): lighter fill and track so they read at night. */
      input.ds-range.ds-dark::-webkit-slider-runnable-track { background: linear-gradient(to right, #8DB4DC var(--fill, 0%), #6B7A92 var(--fill, 0%)); }
      input.ds-range.ds-dark::-moz-range-track { background: #6B7A92; }
      input.ds-range.ds-dark::-moz-range-progress { background: #8DB4DC; }
      input.ds-range.ds-dark::-webkit-slider-thumb { background: #EEF1F5; border-color: #0F1826; }
      input.ds-range.ds-dark::-moz-range-thumb { background: #EEF1F5; border-color: #0F1826; }
      /* Phones: 16px text in every field so iOS doesn't zoom the page when
         one is tapped. */
      @media (max-width: 820px) {
        input:not([type="range"]), select, textarea { font-size: 16px !important; }
      }
      /* No sideways scrolling on a phone, ever. */
      html, body { overflow-x: hidden; }
      @media (prefers-reduced-motion: reduce) {
        .ds-pulse { animation: none; }
        * { transition: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
